name = "moontvplus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
database_id = "867c8b42-6a36-42ad-80f6-cb8b20c30dd6"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
USERNAME = "admin"
NEXT_PUBLIC_SITE_NAME = "MoonTVPlus"
NEXT_PUBLIC_DOUBAN_PROXY_TYPE = "direct"
NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE = "direct"
