name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Deploy MoonTVPlus Worker
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      BUILD_TARGET: cloudflare
      NEXT_PUBLIC_STORAGE_TYPE: d1
      NEXT_PUBLIC_SITE_NAME: MoonTVPlus
      NEXT_PUBLIC_DOUBAN_PROXY_TYPE: direct
      NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE: direct

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare
        run: pnpm run build:cloudflare

      - name: Apply tracked D1 migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@4.60.0 d1 migrations apply DB --remote
          pnpm dlx wrangler@4.60.0 deploy
